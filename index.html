<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dr. Sbaitzo v2.20</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="screen">

    <div id="header-box">
      <div id="header-row1">
        <span id="hdr-left">Sound Blaster</span>
        <span id="hdr-title">D R &nbsp; S B A I T Z O</span>
        <span id="hdr-right">version 2.20</span>
      </div>
      <div id="header-row2">
        <span id="hdr-copy"><span class="copy-green">(c) Copyright rw5555 Labs, Inc. 2026,</span> all rights reserved</span>
      </div>
    </div>

    <!-- PASSWORD GATE: sits in place of #output until dismissed -->
    <div id="pw-gate" style="flex:1;display:flex;justify-content:center;align-items:flex-start;padding-top:clamp(8px,1.2vw,20px);">
      <span id="pw-line" style="color:#55FF55;">ENTER PASSWORD: <span id="pw-typed"></span><span style="animation:blink 1s step-end infinite;">_</span></span>
    </div>

    <div id="output" style="display:none;">
      <div id="input-line">
        <span id="prompt"></span><span id="typed-text"></span><span id="cursor">_</span>
      </div>
    </div>

  </div>

  <style>@keyframes blink { 50% { opacity:0; } }</style>
  <script>
    (function() {
      var gate = document.getElementById('pw-gate');
      var output = document.getElementById('output');
      var pwTyped = document.getElementById('pw-typed');
      var pwLine = document.getElementById('pw-line');
      var buf = '', done = false;
      document.addEventListener('keydown', function(e) {
        if (done) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        if (e.key === 'Enter') {
          if (buf.toLowerCase() === 'sbaitzo') {
            done = true;
            gate.style.display = 'none';
            output.style.display = '';
          } else {
            buf = '';
            pwLine.style.color = '#FF5555';
            pwTyped.textContent = 'WRONG PW';
            setTimeout(function() { pwLine.style.color = '#55FF55'; pwTyped.textContent = ''; }, 1200);
          }
        } else if (e.key === 'Backspace') {
          buf = buf.slice(0, -1);
          pwTyped.textContent = '*'.repeat(buf.length);
        } else if (e.key.length === 1) {
          buf += e.key;
          pwTyped.textContent = '*'.repeat(buf.length);
        }
      }, true);
    })();
  </script>

  <script src="mespeak.js"></script>
  <script src="mespeak-core.js"></script>
  <script src="patterns.js"></script>
  <script src="app.js"></script>
</body>
</html>
